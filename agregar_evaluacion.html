{% extends "base.html" %}
{% block title %}Agregar Evaluación - Brigada Juvenil 2026{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-4"><a href="{{ url_for('evaluaciones') }}" class="text-red-500 hover:text-red-600">← Volver</a></div>
    <div class="flex items-center mb-6"><div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center border-2 border-red-500 mr-4"><i class="fas fa-star text-red-500 text-xl"></i></div><div><h1 class="text-3xl font-bold text-primary">Agregar Evaluación</h1><p class="text-secondary">Registrar una nueva evaluación</p></div></div>

    <form method="POST" class="card p-6">
        <div class="section-title mb-4"><h2 class="text-lg font-bold text-primary"><i class="fas fa-info-circle text-red-500 mr-2"></i>Datos de la Evaluación</h2></div>
        <div class="space-y-4">
            <div><label class="block text-primary font-semibold mb-2">Brigadista *</label><select name="brigadista_id" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none text-primary"><option value="">Seleccionar</option>{% for b in brigadistas %}<option value="{{ b.id }}">{{ b.nombre }} {{ b.apellido }}</option>{% endfor %}</select></div>
            <div><label class="block text-primary font-semibold mb-2">Tipo *</label><select name="tipo" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none text-primary"><option value="Teorica">Teórica</option><option value="Practica">Práctica</option><option value="Fisica">Física</option><option value="Actitud">Actitud</option><option value="Integral">Integral</option></select></div>
            <div><label class="block text-primary font-semibold mb-2">Fecha *</label><input type="date" name="fecha" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none text-primary"></div>
            <div><label class="block text-primary font-semibold mb-2">Puntaje (0-100)</label><input type="number" name="puntaje" min="0" max="100" step="0.01" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none text-primary" placeholder="Ej: 85.5"><p class="text-muted">Valor entre 0 y 100</p></div>
            <div><label class="block text-primary font-semibold mb-2">Calificación</label><select name="calificacion" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none text-primary"><option value="">Seleccionar</option><option value="A">A - Excelente</option><option value="B">B - Bueno</option><option value="C">C - Regular</option><option value="D">D - Deficiente</option><option value="E">E - Insuficiente</option></select></div>
            <div><label class="block text-primary font-semibold mb-2">Descripción</label><textarea name="descripcion" rows="3" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none text-primary" placeholder="Descripción de la evaluación"></textarea><p class="text-muted">Máximo 500</p></div>
            <div><label class="block text-primary font-semibold mb-2">Observaciones</label><textarea name="observaciones" rows="3" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none text-primary" placeholder="Observaciones adicionales"></textarea><p class="text-muted">Máximo 500</p></div>
        </div>
        <div class="flex gap-3 mt-6 pt-4 border-t-2 border-red-200">
            <button type="submit" class="btn-primary px-6 py-2 rounded-lg"><i class="fas fa-save mr-2"></i>Guardar Evaluación</button>
            <a href="{{ url_for('evaluaciones') }}" class="bg-gray-400 text-white px-6 py-2 rounded-lg hover:bg-gray-500"><i class="fas fa-times mr-2"></i>Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
