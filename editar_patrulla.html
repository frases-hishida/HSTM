{% extends "base.html" %}
{% block title %}Editar Patrulla - Brigada Juvenil 2026{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-4">
        <a href="{{ url_for('patrullas') }}" class="text-red-500 hover:text-red-600">← Volver a Patrullas</a>
    </div>

    <div class="card p-6">
        <h1 class="text-2xl font-bold text-primary mb-6">✏️ Editar Patrulla</h1>

        <form method="POST">
            <div class="space-y-4">
                <div>
                    <label class="block text-primary font-semibold mb-2">Nombre de la Patrulla *</label>
                    <input type="text" name="nombre" value="{{ patrulla.nombre }}" required maxlength="50" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-primary font-semibold mb-2">Descripción</label>
                    <textarea name="descripcion" rows="3" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">{{ patrulla.descripcion or '' }}</textarea>
                </div>
                <div>
                    <label class="block text-primary font-semibold mb-2">Color</label>
                    <input type="color" name="color" value="{{ patrulla.color or '#dc2626' }}" class="w-full h-12 border-2 border-gray-300 rounded-lg">
                </div>
            </div>
            <div class="flex gap-3 mt-6 pt-4 border-t-2 border-red-200">
                <button type="submit" class="btn-primary px-6 py-2 rounded-lg"><i class="fas fa-save mr-2"></i>Guardar Cambios</button>
                <a href="{{ url_for('ver_patrulla', id=patrulla.id) }}" class="bg-gray-400 text-white px-6 py-2 rounded-lg hover:bg-gray-500">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
