{% extends "base.html" %}
{% block title %}Agregar Patrulla - Brigada Juvenil 2026{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-4"><a href="{{ url_for('patrullas') }}" class="text-red-500 hover:text-red-600">← Volver</a></div>
    <div class="flex items-center mb-6"><div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center border-2 border-red-500 mr-4"><i class="fas fa-users text-red-500 text-xl"></i></div><div><h1 class="text-3xl font-bold text-primary">Agregar Patrulla</h1><p class="text-secondary">Crea un nuevo grupo de brigadistas</p></div></div>

    <form method="POST" class="card p-6">
        <div class="section-title mb-4"><h2 class="text-lg font-bold text-primary"><i class="fas fa-info-circle text-red-500 mr-2"></i>Datos de la Patrulla</h2></div>
        <div class="space-y-4">
            <div><label class="block text-primary font-semibold mb-2">Nombre *</label><input type="text" name="nombre" required maxlength="50" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none text-primary" placeholder="Ej: Águilas"><p class="text-muted">Máximo 50 caracteres</p></div>
            <div><label class="block text-primary font-semibold mb-2">Descripción</label><textarea name="descripcion" rows="3" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none text-primary" placeholder="Descripción de la patrulla"></textarea><p class="text-muted">Máximo 500 caracteres</p></div>
            <div><label class="block text-primary font-semibold mb-2">Color</label><input type="color" name="color" value="#dc2626" class="w-full h-12 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none"></div>
        </div>
        <div class="flex gap-3 mt-6 pt-4 border-t-2 border-red-200">
            <button type="submit" class="btn-primary px-6 py-2 rounded-lg"><i class="fas fa-save mr-2"></i>Crear Patrulla</button>
            <a href="{{ url_for('patrullas') }}" class="bg-gray-400 text-white px-6 py-2 rounded-lg hover:bg-gray-500"><i class="fas fa-times mr-2"></i>Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
