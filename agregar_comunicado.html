{% extends "base.html" %}
{% block title %}Agregar Comunicado - Brigada Juvenil 2026{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-4"><a href="{{ url_for('comunicados') }}" class="text-red-500 hover:text-red-600">← Volver</a></div>
    <div class="flex items-center mb-6"><div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center border-2 border-red-500 mr-4"><i class="fas fa-bullhorn text-red-500 text-xl"></i></div><div><h1 class="text-3xl font-bold text-primary">Nuevo Comunicado</h1><p class="text-secondary">Enviar mensaje a la brigada</p></div></div>

    <form method="POST" class="card p-6">
        <div class="space-y-4">
            <div><label class="block text-primary font-semibold mb-2">Título *</label><input type="text" name="titulo" required maxlength="100" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none text-primary" placeholder="Título del comunicado"><p class="text-muted">Máximo 100</p></div>
            <div><label class="block text-primary font-semibold mb-2">Contenido *</label><textarea name="contenido" required rows="5" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none text-primary" placeholder="Mensaje del comunicado"></textarea><p class="text-muted">Máximo 2000 caracteres</p></div>
            <div><label class="block text-primary font-semibold mb-2">Destinatario</label><select name="destinatario" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none text-primary"><option value="Todos">Todos</option><option value="Instructores">Instructores</option><option value="Coordinadores">Coordinadores</option><option value="Padres">Padres</option></select></div>
        </div>
        <div class="flex gap-3 mt-6 pt-4 border-t-2 border-red-200">
            <button type="submit" class="btn-primary px-6 py-2 rounded-lg"><i class="fas fa-save mr-2"></i>Publicar</button>
            <a href="{{ url_for('comunicados') }}" class="bg-gray-400 text-white px-6 py-2 rounded-lg hover:bg-gray-500"><i class="fas fa-times mr-2"></i>Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
