{% extends "base.html" %}
{% block title %}Editar Actividad - Brigada Juvenil 2026{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-4">
        <a href="{{ url_for('actividades') }}" class="text-red-500 hover:text-red-600">← Volver a Actividades</a>
    </div>

    <div class="card p-6">
        <h1 class="text-2xl font-bold text-primary mb-6">✏️ Editar Actividad</h1>

        <form method="POST">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-primary font-semibold mb-2">Título *</label>
                    <input type="text" name="titulo" value="{{ actividad.titulo }}" required maxlength="100" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-primary font-semibold mb-2">Descripción</label>
                    <textarea name="descripcion" rows="3" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">{{ actividad.descripcion or '' }}</textarea>
                </div>
                <div>
                    <label class="block text-primary font-semibold mb-2">Fecha *</label>
                    <input type="date" name="fecha" value="{{ actividad.fecha }}" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-primary font-semibold mb-2">Tipo</label>
                    <select name="tipo" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">
                        <option value="Teorica" {% if actividad.tipo == 'Teorica' %}selected{% endif %}>Teórica</option>
                        <option value="Practica" {% if actividad.tipo == 'Practica' %}selected{% endif %}>Práctica</option>
                        <option value="Deportiva" {% if actividad.tipo == 'Deportiva' %}selected{% endif %}>Deportiva</option>
                        <option value="Social" {% if actividad.tipo == 'Social' %}selected{% endif %}>Social</option>
                        <option value="Emergencia" {% if actividad.tipo == 'Emergencia' %}selected{% endif %}>Emergencia</option>
                    </select>
                </div>
                <div>
                    <label class="block text-primary font-semibold mb-2">Hora Inicio</label>
                    <input type="time" name="hora_inicio" value="{{ actividad.hora_inicio or '' }}" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-primary font-semibold mb-2">Hora Fin</label>
                    <input type="time" name="hora_fin" value="{{ actividad.hora_fin or '' }}" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-primary font-semibold mb-2">Patrulla</label>
                    <select name="patrulla_id" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">
                        <option value="">Todas las patrullas</option>
                        {% for p in patrullas %}
                        <option value="{{ p.id }}" {% if actividad.patrulla_id == p.id %}selected{% endif %}>{{ p.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-primary font-semibold mb-2">Lugar</label>
                    <input type="text" name="lugar" value="{{ actividad.lugar or '' }}" maxlength="100" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-primary font-semibold mb-2">Notas</label>
                    <textarea name="notas" rows="3" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">{{ actividad.notas or '' }}</textarea>
                </div>
            </div>
            <div class="flex gap-3 mt-6 pt-4 border-t-2 border-red-200">
                <button type="submit" class="btn-primary px-6 py-2 rounded-lg"><i class="fas fa-save mr-2"></i>Guardar</button>
                <a href="{{ url_for('ver_actividad', id=actividad.id) }}" class="bg-gray-400 text-white px-6 py-2 rounded-lg hover:bg-gray-500">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
