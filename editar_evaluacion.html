{% extends "base.html" %}
{% block title %}Editar Evaluación - Brigada Juvenil 2026{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-4">
        <a href="{{ url_for('evaluaciones') }}" class="text-red-500 hover:text-red-600">← Volver a Evaluaciones</a>
    </div>

    <div class="card p-6">
        <h1 class="text-2xl font-bold text-primary mb-6">✏️ Editar Evaluación</h1>

        <form method="POST">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-primary font-semibold mb-2">Brigadista *</label>
                    <select name="brigadista_id" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">
                        <option value="">Seleccionar</option>
                        {% for b in brigadistas %}
                        <option value="{{ b.id }}" {% if evaluacion.brigadista_id == b.id %}selected{% endif %}>{{ b.nombre }} {{ b.apellido }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-primary font-semibold mb-2">Tipo *</label>
                    <select name="tipo" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">
                        <option value="Teorica" {% if evaluacion.tipo == 'Teorica' %}selected{% endif %}>Teórica</option>
                        <option value="Practica" {% if evaluacion.tipo == 'Practica' %}selected{% endif %}>Práctica</option>
                        <option value="Fisica" {% if evaluacion.tipo == 'Fisica' %}selected{% endif %}>Física</option>
                        <option value="Actitud" {% if evaluacion.tipo == 'Actitud' %}selected{% endif %}>Actitud</option>
                        <option value="Integral" {% if evaluacion.tipo == 'Integral' %}selected{% endif %}>Integral</option>
                    </select>
                </div>
                <div>
                    <label class="block text-primary font-semibold mb-2">Fecha *</label>
                    <input type="date" name="fecha" value="{{ evaluacion.fecha }}" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-primary font-semibold mb-2">Puntaje</label>
                    <input type="number" name="puntaje" value="{{ evaluacion.puntaje or '' }}" step="0.01" min="0" max="100" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-primary font-semibold mb-2">Calificación</label>
                    <select name="calificacion" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">
                        <option value="">Seleccionar</option>
                        <option value="A" {% if evaluacion.calificacion == 'A' %}selected{% endif %}>A - Excelente</option>
                        <option value="B" {% if evaluacion.calificacion == 'B' %}selected{% endif %}>B - Bueno</option>
                        <option value="C" {% if evaluacion.calificacion == 'C' %}selected{% endif %}>C - Regular</option>
                        <option value="D" {% if evaluacion.calificacion == 'D' %}selected{% endif %}>D - Deficiente</option>
                        <option value="E" {% if evaluacion.calificacion == 'E' %}selected{% endif %}>E - Insuficiente</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-primary font-semibold mb-2">Descripción</label>
                    <textarea name="descripcion" rows="3" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">{{ evaluacion.descripcion or '' }}</textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-primary font-semibold mb-2">Observaciones</label>
                    <textarea name="observaciones" rows="3" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none">{{ evaluacion.observaciones or '' }}</textarea>
                </div>
            </div>
            <div class="flex gap-3 mt-6 pt-4 border-t-2 border-red-200">
                <button type="submit" class="btn-primary px-6 py-2 rounded-lg"><i class="fas fa-save mr-2"></i>Guardar</button>
                <a href="{{ url_for('ver_evaluacion', id=evaluacion.id) }}" class="bg-gray-400 text-white px-6 py-2 rounded-lg hover:bg-gray-500">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
